apiVersion: v1
kind: Service
metadata:
  name: ksp-service
  labels:
    app: ksp-app
  annotations:
    service.beta.kubernetes.io/azure-load-balancer-affinity: "clientip"
    service.beta.kubernetes.io/azure-load-balancer-affinity-timeout: "10800"
spec:
  type: LoadBalancer
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 10800
  ports:
  - port: 80
    targetPort: 8000
    protocol: TCP
    name: http
  selector:
    app: ksp-app

