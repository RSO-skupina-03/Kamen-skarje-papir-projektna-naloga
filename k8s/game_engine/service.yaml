apiVersion: v1
kind: Service
metadata:
  name: ksp-game-engine-service
  labels:
    app: ksp-game-engine
spec:
  type: ClusterIP
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 10800
  ports:
  - port: 8081
    targetPort: 8081
    protocol: TCP
    name: http
  selector:
    app: ksp-game-engine
