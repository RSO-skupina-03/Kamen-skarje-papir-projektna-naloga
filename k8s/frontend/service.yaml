apiVersion: v1
kind: Service
metadata:
  name: ksp-frontend-service
  labels:
    app: ksp-frontend
spec:
  type: ClusterIP
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 10800
  ports:
  - port: 8080
    targetPort: 8080
    protocol: TCP
    name: http
  selector:
    app: ksp-frontend
