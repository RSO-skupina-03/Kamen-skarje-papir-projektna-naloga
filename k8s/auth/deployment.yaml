apiVersion: apps/v1
kind: Deployment
metadata:
  name: ksp-auth
  labels:
    app: ksp-auth
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ksp-auth
  template:
    metadata:
      labels:
        app: ksp-auth
    spec:
      containers:
      - name: ksp-auth
        image: filipmerkan/ksp-auth:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8082
          name: http
        env:
        - name: SESSION_COOKIE_SECRET
          valueFrom:
            secretKeyRef:
              name: ksp-secrets
              key: session-cookie-secret
        - name: AUTH_URL
          value: "http://kamen-skarje-papir.click:8082"  # Domain for auth service (port 8082)
        - name: GAME_ENGINE_URL
          value: "http://ksp-game-engine-service:8081"
        - name: FRONTEND_URL
          value: "http://kamen-skarje-papir.click"  # Domain for frontend service (port 80)
        - name: GOOGLE_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: ksp-secrets
              key: google-client-id
        - name: GOOGLE_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: ksp-secrets
              key: google-client-secret
        volumeMounts:
        - name: secrets-store
          mountPath: /mnt/secrets-store
          readOnly: true
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8082
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /ready
            port: 8082
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
      volumes:
      - name: secrets-store
        csi:
          driver: secrets-store.csi.k8s.io
          readOnly: true
          volumeAttributes:
            secretProviderClass: ksp-secrets
