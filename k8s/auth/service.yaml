apiVersion: v1
kind: Service
metadata:
  name: ksp-auth-service
  labels:
    app: ksp-auth
spec:
  type: ClusterIP
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 10800
  ports:
  - port: 8082
    targetPort: 8082
    protocol: TCP
    name: http
  selector:
    app: ksp-auth
