apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ksp-frontend-ingress
  namespace: default
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/affinity: "cookie"
    nginx.ingress.kubernetes.io/affinity-mode: "persistent"
    nginx.ingress.kubernetes.io/session-cookie-name: "ingress-session"
    nginx.ingress.kubernetes.io/session-cookie-expires: "10800"
    nginx.ingress.kubernetes.io/session-cookie-max-age: "10800"
    nginx.ingress.kubernetes.io/session-cookie-path: "/"
    nginx.ingress.kubernetes.io/session-cookie-samesite: "Lax"
spec:
  ingressClassName: nginx
  rules:
  # Rule for domain name
  - host: kamen-skarje-papir.click
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: ksp-frontend-service
            port:
              number: 8080
  # Default rule (for IP access during testing)
  - http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: ksp-frontend-service
            port:
              number: 8080
