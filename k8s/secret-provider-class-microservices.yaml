apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: ksp-secrets
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "true"
    userAssignedIdentityID: "<USER_ASSIGNED_IDENTITY_ID>"  # Client ID of kubelet identity (will be updated by deploy script)
    keyvaultName: "ksp-kv-microservices"
    tenantId: "<AZURE_TENANT_ID>"  # Will be updated by deploy script
    objects: |
      array:
        - |
          objectName: session-cookie-secret
          objectType: secret
          objectVersion: ""
        - |
          objectName: db-url
          objectType: secret
          objectVersion: ""
        - |
          objectName: google-client-id
          objectType: secret
          objectVersion: ""
        - |
          objectName: google-client-secret
          objectType: secret
          objectVersion: ""
    objectFormat: json
  secretObjects:
    - secretName: ksp-secrets
      type: Opaque
      data:
        - objectName: session-cookie-secret
          key: session-cookie-secret
        - objectName: db-url
          key: db-url
        - objectName: google-client-id
          key: google-client-id
        - objectName: google-client-secret
          key: google-client-secret
