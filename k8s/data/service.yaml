apiVersion: v1
kind: Service
metadata:
  name: ksp-data-service
  labels:
    app: ksp-data
spec:
  type: ClusterIP
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 10800
  ports:
  - port: 8083
    targetPort: 8083
    protocol: TCP
    name: http
  selector:
    app: ksp-data

