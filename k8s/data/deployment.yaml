apiVersion: apps/v1
kind: Deployment
metadata:
  name: ksp-data
  labels:
    app: ksp-data
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ksp-data
  template:
    metadata:
      labels:
        app: ksp-data
    spec:
      containers:
      - name: ksp-data
        image: filipmerkan/ksp-data:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8083
          name: http
        env:
        - name: DB_URL
          valueFrom:
            secretKeyRef:
              name: ksp-secrets
              key: db-url
        volumeMounts:
        - name: secrets-store
          mountPath: /mnt/secrets-store
          readOnly: true
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8083
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /ready
            port: 8083
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
      volumes:
      - name: secrets-store
        csi:
          driver: secrets-store.csi.k8s.io
          readOnly: true
          volumeAttributes:
            secretProviderClass: ksp-secrets

