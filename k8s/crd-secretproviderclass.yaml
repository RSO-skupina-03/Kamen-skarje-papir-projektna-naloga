apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: secretproviderclasses.secrets-store.csi.x-k8s.io
spec:
  group: secrets-store.csi.x-k8s.io
  versions:
  - name: v1
    served: true
    storage: true
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            properties:
              provider:
                type: string
              parameters:
                type: object
                x-kubernetes-preserve-unknown-fields: true
              secretObjects:
                type: array
                items:
                  type: object
                  properties:
                    secretName:
                      type: string
                    type:
                      type: string
                    data:
                      type: array
                      items:
                        type: object
                        properties:
                          objectName:
                            type: string
                          key:
                            type: string
  scope: Namespaced
  names:
    plural: secretproviderclasses
    singular: secretproviderclass
    kind: SecretProviderClass
    shortNames:
    - spc

