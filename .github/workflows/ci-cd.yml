name: CI/CD Pipeline

on:
  push:
    branches:
      - master
    paths:
      - 'services/**'
      - 'k8s/**'
      - '.github/workflows/**'
  pull_request:
    branches:
      - master
    paths:
      - 'services/**'
      - 'k8s/**'

env:
  REGISTRY: docker.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        service:
          - name: auth
            context: ./services/auth
            dockerfile: ./services/auth/Dockerfile
          - name: frontend
            context: ./services/frontend
            dockerfile: ./services/frontend/Dockerfile
          - name: game-engine
            context: ./services/game_engine
            dockerfile: ./services/game_engine/Dockerfile
          - name: data
            context: ./services/data
            dockerfile: ./services/data/Dockerfile

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/ksp-${{ matrix.service.name }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.service.context }}
          file: ${{ matrix.service.dockerfile }}
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  validate-k8s:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate Kubernetes manifests
        uses: instrumenta/kubeval@master
        with:
          files: k8s/**/*.yaml
          strict: true
          ignore-missing-schemas: true
